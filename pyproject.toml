[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "embpilot"
version = "0.1.0"
description = "MCP server for embedded device debugging — connect, control, and debug hardware via Serial/Telnet/SSH through LLM agents"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [
    { name = "EmbPilot Contributors" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Debuggers",
    "Topic :: System :: Hardware :: Hardware Drivers",
]

dependencies = [
    "mcp>=1.0.0",
    "pyserial-asyncio>=0.6",
    "aiosqlite>=0.20",
    "telnetlib3>=2.0",
    "asyncssh>=2.14",
]

[project.scripts]
embpilot = "embpilot.__main__:main"

[project.optional-dependencies]
rag = [
    "fastembed>=0.3",
    "lancedb>=0.9",
    "pandas>=2.0",
    "pyarrow>=14.0",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "fastembed>=0.3",
    "lancedb>=0.9",
    "pandas>=2.0",
    "pyarrow>=14.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"embpilot.core" = ["schema_*.sql"]
